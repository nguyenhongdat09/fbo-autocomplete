<!-- FBO Query Results — AG Grid, nhiều bảng xếp dọc -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Results</title>
    {{CSP_META}}
    {{AG_GRID_STYLES}}
    {{CSS_URI}}
</head>
<body>
    <div class="tab-container" id="tabContainer"></div>

    <div class="tab-content active" id="resultsTab">
        <div class="table-wrapper">
            <div class="table-container" id="tableContainer"></div>
        </div>
    </div>

    <div class="tab-content" id="messagesTab" style="display: none;">
        <div class="messages-container" id="messagesContainer"></div>
    </div>

    <div class="status-bar" id="statusBar">
        <div class="status-item" id="rowInfo">0 rows</div>
        <div class="status-separator">|</div>
        <div class="status-item" id="statisticsInfo"></div>
        <div class="status-separator">|</div>
        <div class="status-item" id="executionTime">0ms</div>
        <div class="status-item status-right" id="dbInfo"></div>
    </div>

    {{AG_GRID_SCRIPT}}
    {{SCRIPTS}}
    {{DATA}}

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (!window.queryResults) {
                    throw new Error('No query results data found');
                }
                if (typeof CONFIG === 'undefined' || typeof TabManager === 'undefined') {
                    throw new Error('Missing CONFIG or TabManager');
                }
                if (typeof initQueryResultsAgGrid !== 'function') {
                    throw new Error('initQueryResultsAgGrid not defined');
                }
                initQueryResultsAgGrid();
            } catch (error) {
                console.error('Initialization error:', error);
                document.body.innerHTML = '<div style="padding: 20px; color: var(--vscode-errorForeground, red);">' +
                    '<h3>Error Loading Results</h3><pre>' + (error.message || error) + '</pre></div>';
            }
        });
    </script>
</body>
</html>
